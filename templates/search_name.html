{% extends "base.html" %}
{% block title %}
<title>學生資料管理系統-依姓名搜尋</title>
{% endblock  %}

{% block content %}
<h1 class="h3 text-primary mb-4">依姓名搜尋</h1>
<div class="card">
    <div class="card-body p-4">
        <form action="{% url 'search_list' %}" method="get" class="row g-2 align-items-center">
            <label for="cname" class="col-auto col-form-label">姓名</label>
            <div class="col-auto">
                <input type="text" class="form-control" id="cname" name="cname">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-search me-1"></i>搜尋
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock  %}
